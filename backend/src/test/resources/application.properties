spring.application.name=recruitshield-backend-test

# Database Configuration for test environment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/recruitshield?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:recruitshield_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:recruitshield_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CORS settings
spring.web.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Dedicated test-only mock JWT secret for automated testing (not used in normal runtime)
jwt.secret=test-mock-jwt-secret-key-dedicated-for-automated-tests-only-min-256-bits!
jwt.expiration-ms=86400000
