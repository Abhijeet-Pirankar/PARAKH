spring.application.name=recruitshield-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/recruitshield?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=recruitshield_user
spring.datasource.password=recruitshield_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=8080

# CORS settings for frontend to communicate with backend
spring.web.cors.allowed-origins=http://localhost:5173
