spring.application.name=recruitshield-backend

# Server port
server.port=8080

# Database Configuration (supports env vars with local defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/recruitshield?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:recruitshield_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:recruitshield_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CORS settings for frontend to communicate with backend
spring.web.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# JWT Security Configuration (requires JWT_SECRET environment variable)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Python AI/ML Service Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.enabled=${AI_SERVICE_ENABLED:true}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:3000}

# Rate Limiting Configuration for Public Offer Analysis Endpoints
rate.limit.enabled=${RATE_LIMIT_ENABLED:true}
rate.limit.requests-per-minute=${RATE_LIMIT_PER_MINUTE:30}
rate.limit.requests-per-hour=${RATE_LIMIT_PER_HOUR:120}
rate.limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}

# Authentication Rate Limiting Configuration (Login and Registration)
rate.limit.auth.login-per-minute=${RATE_LIMIT_AUTH_LOGIN_PER_MINUTE:10}
rate.limit.auth.register-per-minute=${RATE_LIMIT_AUTH_REGISTER_PER_MINUTE:5}
