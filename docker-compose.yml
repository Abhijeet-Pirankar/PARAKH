version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: recruitshield-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recruitshield
      MYSQL_USER: recruitshield_user
      MYSQL_PASSWORD: recruitshield_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema:/docker-entrypoint-initdb.d

volumes:
  db_data:
